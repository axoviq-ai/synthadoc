name: Publish Docker Image

on:
  release:
    types: [published]   # fires on the same event as publish.yml (PyPI)

env:
  IMAGE: chenp/synthadoc

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed if also pushing to ghcr.io

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from release tag
        id: version
        # Release tags are vX.Y.Z; strip the leading 'v' for the image tag.
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Tag with the exact version and update :latest
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:latest
          # Cache layers between runs to speed up builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build for both amd64 (Linux servers) and arm64 (Apple Silicon, Graviton)
          platforms: linux/amd64,linux/arm64
