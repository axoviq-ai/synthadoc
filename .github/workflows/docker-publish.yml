name: Publish Docker Image

on:
  # Run only after the PyPI publish workflow succeeds — the Dockerfile
  # installs synthadoc from PyPI, so Docker must start after PyPI is live.
  workflow_run:
    workflows: ["Publish to PyPI"]
    types: [completed]

env:
  IMAGE: chenp/synthadoc

jobs:
  build-and-push:
    # Skip if the PyPI publish failed or was cancelled.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed if also pushing to ghcr.io

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0   # fetch all tags so git describe can find the release tag

      - name: Extract version from release tag
        id: version
        # workflow_run doesn't set GITHUB_REF_NAME; derive the tag from the commit.
        run: |
          TAG=$(git describe --tags --exact-match HEAD)
          echo "tag=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Tag with the exact version and update :latest
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:latest
          # Pin the exact release version so the image matches the git tag.
          build-args: |
            SYNTHADOC_VERSION=${{ steps.version.outputs.tag }}
          # Cache layers between runs to speed up builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build for both amd64 (Linux servers) and arm64 (Apple Silicon, Graviton)
          platforms: linux/amd64,linux/arm64
