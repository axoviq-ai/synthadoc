name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Default GITHUB_TOKEN scope for jobs that don't declare their own
# permissions block. coverage-badge below declares its own contents:write,
# which fully overrides this default for that job only.
# #CodeQL actions/missing-workflow-permissions
permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Fail if README-pypi.md is out of sync
        shell: bash
        run: |
          python scripts/prepare_pypi_readme.py
          if ! git diff --exit-code README-pypi.md; then
            echo ""
            echo "ERROR: README-pypi.md is out of sync with README.md."
            echo "Run locally and commit the result:"
            echo "  python scripts/prepare_pypi_readme.py"
            echo "  git add README-pypi.md"
            exit 1
          fi
      - run: pip install -e ".[dev]"
      - run: pip install "mcp>=1.0,<2.0"
      - run: python scripts/update_badges.py --check
      - run: pytest --cov=synthadoc --cov-report=term-missing -v

  # The shared security package is a leaf: stdlib, httpx and filelock only. Its tests run
  # on every supported Python version in a LEAN environment on purpose. Installing the
  # full dev extras would pull heavy optional dependencies (embedding runtime) that may
  # have no wheels on the newest Python, and would hide an accidental import of
  # synthadoc.core, agents or config from the package. cryptography is only for the
  # real-TLS pinning test; pytest-timeout stops a runaway regex from hanging the job.
  security-package:
    name: security package (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install httpx filelock cryptography pytest pytest-asyncio pytest-timeout
      - run: python -m pytest tests/security/package -v

  # The skills promise (v0.9.3) to work without a Synthadoc wiki or server. This installs
  # ONLY the skills' own requirements plus the Synthadoc wheel WITHOUT its dependencies, then
  # runs every skill from that installed wheel. It fails if a skill needs core, agents,
  # config or any other non-skill module, or if a file a skill needs is missing from the wheel.
  skills-standalone:
    name: skills standalone (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install only the skills' own requirements
        run: |
          cat synthadoc/skills/*/requirements.txt | grep -v '^[[:space:]]*#' | grep -v '^[[:space:]]*$' | sort -u > "$RUNNER_TEMP/skill-requirements.txt"
          cat "$RUNNER_TEMP/skill-requirements.txt"
          pip install -r "$RUNNER_TEMP/skill-requirements.txt"
      - name: Install the Synthadoc wheel without its dependencies
        run: pip install --no-deps .
      - name: Run every skill from the installed wheel
        run: cd "$RUNNER_TEMP" && python -E "$GITHUB_WORKSPACE/scripts/check_standalone_skills.py"

  coverage-badge:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/prepare_pypi_readme.py
      - run: pip install -e ".[dev]"
      - run: pip install "mcp>=1.0,<2.0"
      - run: pytest --cov=synthadoc --cov-report=json -q
      - run: python scripts/update_badges.py --coverage-json coverage.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/badges.json
          git diff --staged --quiet || git commit -m "ci: update coverage badge"
          git push origin HEAD:badges --force

  build-plugin-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd obsidian-plugin && npm ci && npm run build && npm test
      - run: python scripts/sync_plugin.py
      - name: Fail if compiled plugin files are not committed
        shell: bash
        run: |
          if ! git diff --exit-code synthadoc/data/obsidian-plugin/; then
            echo ""
            echo "ERROR: compiled Obsidian plugin files are out of sync."
            echo "Run these locally and commit the result before opening a PR:"
            echo "  cd obsidian-plugin && npm run build"
            echo "  python scripts/sync_plugin.py"
            echo "  git add synthadoc/data/obsidian-plugin/"
            exit 1
          fi
      - run: cd web-ui && npm install && npm run build
      - run: python scripts/sync_web_ui.py
      - name: Fail if compiled web UI files are not committed
        shell: bash
        run: |
          if ! git diff --exit-code synthadoc/data/web-ui/; then
            echo ""
            echo "ERROR: compiled web UI files are out of sync."
            echo "Run these locally and commit the result before opening a PR:"
            echo "  cd web-ui && npm run build"
            echo "  python scripts/sync_web_ui.py"
            echo "  git add synthadoc/data/web-ui/"
            exit 1
          fi
      # Must run after the build+sync steps above: the Obsidian eval-pattern fix
      # (obsidian-plugin/esbuild.config.mjs patchBundle) runs at build time, and
      # sync_plugin.py is what copies the patched main.js into the tracked path
      # this scanner checks. Scanning before that point would see stale content.
      - run: python scripts/security_scan.py
