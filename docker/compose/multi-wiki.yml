# docker/compose/multi-wiki.yml
# Two Synthadoc wikis with cross-wiki query support.
#
# This example uses the two demo wikis from the Docker deployment guide:
#   history-of-computing  →  http://localhost:7070
#   ai-research           →  http://localhost:7071
#
# To use your own wikis, search and replace:
#   history-of-computing  →  your wiki A name
#   ai-research           →  your wiki B name
#   7071 (wiki B port)    →  your wiki B's installed port  (check: synthadoc status -w <name>)
#   All three 7071 values in sd-server-b must match: command, healthcheck, and ports.
#
# ─── SETUP ────────────────────────────────────────────────────────────────────
#
# 1. Set wiki paths and API key in .env (same folder as this file):
#      ANTHROPIC_API_KEY=sk-ant-...
#      WIKI_A_PATH=/home/yourname/wikis/history-of-computing
#      WIKI_B_PATH=/home/yourname/wikis/ai-research
#      On Windows: use forward slashes (C:/Users/...) not backslashes
#
# 2. Start:
#      docker compose -f multi-wiki.yml up -d
#
# 3. Verify both reach (healthy) within 30 seconds:
#      docker compose -f multi-wiki.yml ps
#
# ─── DEBUGGING ────────────────────────────────────────────────────────────────
#
#   View logs:
#     docker compose -f multi-wiki.yml logs sd-server-a --tail 50
#     docker compose -f multi-wiki.yml logs sd-server-b --tail 50
#
#   Recreate one container after editing this file or a wiki's config.toml:
#     docker compose -f multi-wiki.yml up -d --force-recreate sd-server-a
#     docker compose -f multi-wiki.yml up -d --force-recreate sd-server-b
#
#   Recreate both:
#     docker compose -f multi-wiki.yml up -d --force-recreate
#
#   Wiki B stays unhealthy:
#     → The three port values in sd-server-b don't all match, or wiki B's
#       config.toml uses a different port. Check the logs above.
#
#   Cross-wiki query returns "Unexpected error":
#     → Check coordinator logs (sd-server-a) for the real error.
#     → Common causes: wiki name mismatch in the configs block below,
#       wrong port in the configs block, or missing API key for the
#       LLM provider configured in the wiki's config.toml.
#
# ──────────────────────────────────────────────────────────────────────────────

services:
  sd-server-a:
    image: chenp/synthadoc:latest
    container_name: synthadoc-history-of-computing
    restart: unless-stopped
    ports:
      - "7070:7070"
    volumes:
      - ${WIKI_A_PATH:-./wiki-a}:/wiki
    configs:
      - source: cross_wiki_registry
        target: /home/synthadoc/.synthadoc/wikis.json
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}

  sd-server-b:
    image: chenp/synthadoc:latest
    container_name: synthadoc-ai-research
    restart: unless-stopped
    command: ["synthadoc", "serve", "-w", "/wiki", "--host", "0.0.0.0", "--port", "7071"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7071/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    ports:
      - "7071:7071"
    volumes:
      - ${WIKI_B_PATH:-./wiki-b}:/wiki
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}

# Cross-wiki registry — tells the coordinator how to reach each wiki.
# host must be the Compose service name (not localhost).
# purpose_summary is optional: one sentence describing the wiki's domain.
# It helps the coordinator decide which wikis to search for a given question.
configs:
  cross_wiki_registry:
    content: |
      {
        "history-of-computing": {
          "host": "sd-server-a",
          "port": 7070,
          "purpose_summary": "History of computing, pioneers, hardware evolution, and software movements."
        },
        "ai-research": {
          "host": "sd-server-b",
          "port": 7071,
          "purpose_summary": "Artificial intelligence research, machine learning, neural networks, and LLMs."
        }
      }
