# docker/compose/multi-wiki.yml
# Two Synthadoc wikis on different host ports.
#
# Usage:
#   docker compose -f docker/compose/multi-wiki.yml up -d
#
# BEFORE STARTING — check each wiki's installed port:
#   synthadoc status -w <wiki-name>
#
# Then update the three PORT placeholders in sd-server-b below if your
# wiki B is not on 7071. All three must match each other:
#   1. command   --port <PORT>
#   2. healthcheck  localhost:<PORT>/health
#   3. ports     "<PORT>:<PORT>"
#
# Wiki A: http://localhost:7070  (port 7070 is the install default — usually no change needed)
# Wiki B: http://localhost:7071  (change 7071 → your wiki B port if different)

services:
  sd-server-a:
    image: chenp/synthadoc:latest
    container_name: synthadoc-wiki-a
    restart: unless-stopped
    ports:
      - "7070:7070"
    volumes:
      - ${WIKI_A_PATH:-./wiki-a}:/wiki
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}

  sd-server-b:
    image: chenp/synthadoc:latest
    container_name: synthadoc-wiki-b
    restart: unless-stopped
    # ▼ Change 7071 to your wiki B port (all three occurrences below must match)
    command: ["synthadoc", "serve", "-w", "/wiki", "--host", "0.0.0.0", "--port", "7071"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7071/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    ports:
      - "7071:7071"
    # ▲ Change 7071 to your wiki B port (all three occurrences above must match)
    volumes:
      - ${WIKI_B_PATH:-./wiki-b}:/wiki
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
