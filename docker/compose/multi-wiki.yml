# docker/compose/multi-wiki.yml
# Two Synthadoc wikis on different host ports.
#
# Usage:
#   docker compose -f docker/compose/multi-wiki.yml up -d
#
# BEFORE STARTING:
#
# 1. Check each wiki's installed port:
#      synthadoc status -w <wiki-name>
#
# 2. Update the three PORT placeholders in sd-server-b if wiki B is not on 7071.
#    All three must match each other:
#      command   --port <PORT>
#      healthcheck  localhost:<PORT>/health
#      ports     "<PORT>:<PORT>"
#
# 3. Edit wikis.json (same folder as this file) — set the wiki names and ports
#    to match your two wikis. This file is mounted into the coordinator container
#    so cross-wiki queries can discover and reach both wikis.
#
# Wiki A: http://localhost:7070  (port 7070 is the install default — usually no change needed)
# Wiki B: http://localhost:7071  (change 7071 → your wiki B port if different)

services:
  sd-server-a:
    image: chenp/synthadoc:latest
    container_name: synthadoc-wiki-a
    restart: unless-stopped
    ports:
      - "7070:7070"
    volumes:
      - ${WIKI_A_PATH:-./wiki-a}:/wiki
      # Cross-wiki registry: maps wiki names to Docker service-name hostnames.
      # Edit wikis.json before starting — see step 3 in the header comment above.
      - ./wikis.json:/home/synthadoc/.synthadoc/wikis.json:ro
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}

  sd-server-b:
    image: chenp/synthadoc:latest
    container_name: synthadoc-wiki-b
    restart: unless-stopped
    # ▼ Change 7071 to your wiki B port (all three occurrences below must match)
    command: ["synthadoc", "serve", "-w", "/wiki", "--host", "0.0.0.0", "--port", "7071"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7071/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    ports:
      - "7071:7071"
    # ▲ Change 7071 to your wiki B port (all three occurrences above must match)
    volumes:
      - ${WIKI_B_PATH:-./wiki-b}:/wiki
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
